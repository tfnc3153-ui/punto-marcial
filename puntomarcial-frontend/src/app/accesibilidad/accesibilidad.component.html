<a class="skip-link" href="#contenido" (click)="saltarAlContenido($event)">Saltar al contenido</a>

<div class="accesibilidad">

  @if (abierto) {
    <section
      id="panel-accesibilidad"
      class="panel"
      role="region"
      aria-labelledby="titulo-accesibilidad">

      <div class="panel-cabecera">
        <h2 id="titulo-accesibilidad">Accesibilidad</h2>

        <button
          type="button"
          class="cerrar"
          aria-label="Cerrar opciones de accesibilidad"
          (click)="cerrar()">
          <span aria-hidden="true">✕</span>
        </button>
      </div>

      <div class="grupo" role="group" aria-labelledby="etiqueta-tamano">
        <span id="etiqueta-tamano" class="etiqueta">Tamaño de texto</span>

        <div class="opciones">
          @for (opcion of tamanos; track opcion.valor) {
            <button
              type="button"
              class="opcion"
              [attr.aria-pressed]="tamano === opcion.valor"
              [attr.aria-label]="opcion.descripcion"
              (click)="cambiarTamano(opcion.valor)">
              {{ opcion.etiqueta }}
            </button>
          }
        </div>
      </div>

      <div class="grupo">
        <span class="etiqueta">Contraste</span>

        <button
          type="button"
          class="opcion contraste"
          [attr.aria-pressed]="altoContraste"
          (click)="alternarContraste()">
          <svg class="icono-contraste" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
          </svg>
          Alto contraste: {{ altoContraste ? 'activado' : 'desactivado' }}
        </button>
      </div>

    </section>
  }

  <button
    #botonEngranaje
    type="button"
    class="engranaje"
    aria-label="Opciones de accesibilidad"
    aria-controls="panel-accesibilidad"
    [attr.aria-expanded]="abierto"
    (click)="alternarPanel()">

    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.62l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.86a.48.48 0 0 0 .12.62l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.62l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>

  </button>

</div>

#Conexion a Base de Datos

#createDatabaseIfNotExist: si la base no existe (por ejemplo, en otra laptop), se crea sola
spring.datasource.url = jdbc:mysql://localhost:3306/academia_punto_marcial?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = 

#Comportamiento de Hibernate con las tablas

spring.jpa.hibernate.ddl-auto=update

#Datos de prueba (Fase 8): se ejecuta src/main/resources/data.sql en cada arranque,
#después de que Hibernate crea las tablas. Usa INSERT IGNORE, así que no duplica datos.

spring.sql.init.mode = always
spring.jpa.defer-datasource-initialization = true
spring.sql.init.encoding = UTF-8

#Ver el SQL que genera Hibernate

spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

#Puerto en el que corre el API

server.port = 8081

#Correo (HU-12): Gmail con contraseña de aplicación.
#Las credenciales se leen de las variables de entorno MAIL_USERNAME y MAIL_PASSWORD;
#nunca se escriben aquí. Si no están definidas, la compra funciona igual y se avisa que no se envió el correo.

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


